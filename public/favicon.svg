<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="muniagrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background / Container matching MuniaMart Logo -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="112"
    fill="url(#muniagrad)"
    filter="url(#subtle-shadow)"
  />

  <!-- Inner Subtle Border for Premium App Icon Finish -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="112"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.15"
    stroke-width="4"
  />

  <!-- Shopping Bag Icon (Lucide exact paths, bold & crisp for favicon scale) -->
  <g transform="translate(136, 136) scale(10)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Bag Body -->
    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
    <!-- Horizontal Flap/Seam -->
    <path d="M3 6h18" />
    <!-- Handle -->
    <path d="M16 10a4 4 0 0 1-8 0" />
  </g>
</svg>
